# Example config for Alya-chan
# Rename this file to config.toml and fill in the required values.
# Color can be provided as an integer (decimal or 0xHEX) or as a hex string.

# Examples:
# color = 0x5865f2
# color = "#5865f2"
# color = "5865f2"

[color] 
primary = "#5865f2"
no = "#ff0000"

[info]
# Banner image shown on the help menu
banner = "https://i.ibb.co/hrpKCdy/e1da98e96fdfc12635909f99725d971e.png"
# Top.gg bot page URL
vote_url = "https://top.gg/bot/<YOUR_BOT_ID>"

[server]
# Webhook server host (default: 127.0.0.1)
host = "127.0.0.1"
# Webhook server port (default: 3000)
port = 3000

[webhook]
# Discord webhook URL for vote log notifications (optional)
vote_log = ""

[global_chat] # Internal global chat configuration
# Enable or disable the global chat feature
enabled = false
# URL of the global chat API server
api_url = "http://localhost:4000"
# API key for authentication (sent as Authorization: Bearer <key>)
api_key = "your_global_chat_api_key_here"

[chatbot]
# Enable or disable the chatbot feature
enabled = false
# OpenRouter API key (get from https://openrouter.ai/keys)
api_key = "your_openrouter_api_key_here"
# Google Gemini API key (get from https://aistudio.google.com/api-keys)
gemini_api_key = "your_google_gemini_api_key_here"

[top-gg]
# Enable or disable Top.gg stats posting
enabled = false
# Top.gg bot token for posting stats (get from https://top.gg/bot/<your-bot-id>/dashboard/integrations)
token = "your-topgg-token-here"
# Top.gg webhook auth password for receiving votes (set in your bot's webhook settings on Top.gg)
webhook_auth = "your-webhook-auth-password-here"

[database]
# Local SQLite database path (defaults to "data/alya.db" if not specified)
local_path = "data/alya.db"
# Turso remote database URL (For hybrid mode with replication)
# Get from https://turso.tech/
remote_url = "libsql://xxxx.turso.io"
# Turso authentication token (required if remote_url is set)
remote_token = "your_turso_auth_token_here"
